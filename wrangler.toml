name = "q-locate"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/img/*"]

[[d1_databases]]
binding = "DB"
database_name = "q-locate-db"
database_id = "b15bbfdb-cad1-470d-9710-4564338e26ae"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "q-locate-photos"

# Meaning-based search ("closest matches"): Workers AI makes the fingerprints, Vectorize stores them.
[ai]
binding = "AI"

[[vectorize]]
binding = "VEC"
index_name = "q-locate-search"
