name = "q-locate-admin"
main = "worker/admin/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/", "/api/*", "/img/*"]

[vars]
TEAM_DOMAIN = "crimson-bread-7516.cloudflareaccess.com"
POLICY_AUD = ""
AI_MODEL = "claude-sonnet-5-5"
AI_WEB_SEARCH = "on"
IMPORT_BATCH = "2"

[[d1_databases]]
binding = "DB"
database_name = "q-locate-db"
database_id = "b15bbfdb-cad1-470d-9710-4564338e26ae"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "q-locate-photos"

# Meaning-based search: fingerprints are made here when content is published.
[ai]
binding = "AI"

[[vectorize]]
binding = "VEC"
index_name = "q-locate-search"

[triggers]
crons = ["* * * * *"]
